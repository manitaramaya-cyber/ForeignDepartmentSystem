<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root, [data-theme=dark] { --bg:#0A1020; --card:#111A2E; --side:#0C1427; --line:#1F2D4A; --ink:#E8F1FF; --muted:#9BB0CC; --field:#0D1730;
          --accent:#3DD9F5; --good:#35D49A; --warn:#FFB020; --bad:#FF5C7A; --violet:#A78BFA; --mute:#8FA3BF; --onacc:#06101F;
          --shadow:0 0 0 1px rgba(61,217,245,.04), 0 12px 32px rgba(0,0,0,.35); }
  [data-theme=dark] body.teacher { --accent:#35D49A; } [data-theme=dark] body.hr { --accent:#A78BFA; }
  [data-theme=dark] body.overview_hr, [data-theme=dark] body.overview_academic { --accent:#6EA8FF; }
  [data-theme=light] { --bg:#EEF3F8; --card:#FFFFFF; --side:#FFFFFF; --line:#D5DEE9; --ink:#14213A; --muted:#53647F; --field:#F3F7FB;
          --accent:#0A7C9A; --good:#12805C; --warn:#A76500; --bad:#C62847; --violet:#6D4AE0; --mute:#5C6B80; --onacc:#FFFFFF;
          --shadow:0 1px 3px rgba(20,33,58,.10); }
  [data-theme=light] body.teacher { --accent:#0F8A5F; } [data-theme=light] body.hr { --accent:#6D4AE0; }
  [data-theme=light] body.overview_hr, [data-theme=light] body.overview_academic { --accent:#2F63D8; }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; color:var(--ink); font:17px/1.5 'Sarabun',sans-serif; min-height:100vh; background:var(--bg); }
  [data-theme=dark] body { background:radial-gradient(1000px 500px at 90% -10%, #152C55 0%, transparent 60%), var(--bg); }
  h1,h2,.val,.big,.ring b,.col em,.btn,.nav,.tab { font-family:'Kanit',sans-serif; font-weight:600; }
  small { color:var(--muted); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

  /* ---------- ปุ่ม / ฟอร์ม ---------- */
  .btn { font-size:17px; padding:10px 18px; border-radius:10px; border:1px solid var(--accent); cursor:pointer; background:transparent; color:var(--ink); }
  .btn.main { background:var(--accent); color:var(--onacc); }
  .btn.main:disabled { opacity:.6; cursor:wait; }
  .btn.ghost { border-color:var(--line); }
  .btn.ghost:hover { border-color:var(--accent); }
  .btn.sm { padding:7px 16px; font-size:16px; }
  .btn.block { width:100%; }
  .btn.good { border-color:var(--good); background:var(--good); color:#04140D; }
  .btn.bad { border-color:var(--bad); color:var(--bad); }
  .field { display:block; text-align:left; margin-bottom:14px; }
  .field > span { display:block; color:var(--muted); margin-bottom:5px; }
  input[type=text], input[type=password], select, textarea { width:100%; padding:11px 14px; font:18px 'Sarabun',sans-serif; color:var(--ink);
          background:var(--field); border:1px solid var(--line); border-radius:10px; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; margin:4px 0 8px; }
  .showpw { display:flex; align-items:center; gap:8px; margin:-4px 0 14px; color:var(--muted); cursor:pointer; }
  .showpw input { width:20px; height:20px; }
  .msg { min-height:1.6em; margin:0 0 10px; color:var(--bad); text-align:left; }

  /* ---------- Login / เปลี่ยนรหัส ---------- */
  .center { min-height:100vh; display:grid; place-items:center; padding:16px; position:relative; }
  .corner { position:absolute; top:14px; right:14px; display:flex; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 14px; font-size:18px; }
  .login { width:100%; max-width:430px; padding:30px 28px; text-align:center; }
  .login .logo { width:64px; height:64px; margin:0 auto 14px; font-size:20px; }
  .login h1 { margin:0; font-size:26px; line-height:1.25; }
  .login p.sub { margin:4px 0 22px; color:var(--muted); }
  .help { margin-top:16px; font-size:15px; color:var(--muted); }
  .logo { width:44px; height:44px; flex:none; border-radius:50%; border:2px solid var(--accent); display:grid; place-items:center;
          font:600 14px 'Kanit',sans-serif; color:var(--accent); }

  /* ---------- Shell: เมนูซ้าย 20% + แถบบน ---------- */
  .app { display:grid; grid-template-columns:minmax(230px,20%) minmax(0,1fr); grid-template-rows:auto 1fr auto;
         grid-template-areas:"top top" "side main" "bottom bottom"; min-height:100vh; }
  body.hr .app { grid-template-columns:minmax(230px,20%) minmax(0,1fr) minmax(240px,20%); grid-template-areas:"top top top" "side main right" "bottom bottom bottom"; }
  .side { grid-area:side; position:sticky; top:var(--topH,0px); height:calc(100vh - var(--topH,0px)); overflow-y:auto; background:var(--side); border-right:1px solid var(--line);
          display:flex; flex-direction:column; gap:4px; padding:16px 12px; }
  .sbrand { display:flex; align-items:center; gap:10px; padding:2px 8px 14px; }
  .sbrand b { display:block; font:600 17px/1.25 'Kanit',sans-serif; }
  .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; background:transparent;
         border:0; border-left:4px solid transparent; color:var(--ink); font-size:17px; font-weight:500; padding:10px 12px; border-radius:8px; cursor:pointer; }
  .nav:hover { background:var(--field); }
  .nav.on { background:var(--field); border-left-color:var(--accent); color:var(--accent); }
  .nav.sub { font:400 16px 'Sarabun',sans-serif; padding:7px 12px 7px 30px; }
  .nav.sub.on { font-weight:600; }
  .nav .chev { color:var(--muted); font-size:13px; }
  .badge { min-width:24px; padding:0 8px; border-radius:99px; background:var(--warn); color:#1A1200; font:600 15px 'Sarabun',sans-serif; text-align:center; }
  .sfoot { margin-top:auto; display:grid; gap:8px; padding-top:14px; border-top:1px solid var(--line); }
  /* ---------- โหมดคุณกิตติพันธ์ (HR Admin): แถบบนโปร่งใส · แผงแจ้งเตือนขวา · แถบล่าง ---------- */
  .rightp { grid-area:right; position:sticky; top:var(--topH,0px); height:calc(100vh - var(--topH,0px)); overflow-y:auto; padding:16px 14px;
            border-left:1px solid var(--line); background:var(--side); display:grid; gap:12px; align-content:start; }
  .rightp h2 { margin:0; font-size:18px; }
  .alert { display:block; width:100%; text-align:left; border:1px solid var(--c); border-left-width:5px; border-radius:10px; padding:8px 12px;
           background:var(--field); cursor:pointer; color:var(--ink); font:400 16px/1.4 'Sarabun',sans-serif; }
  .alert.bad { --c:var(--bad); } .alert.warn { --c:var(--warn); }
  .alert b { display:block; } .alert small { display:block; }
  .modal { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:grid; place-items:center; padding:16px; }
  .mbox { max-width:440px; text-align:center; display:grid; gap:16px; }
  .mbox p { margin:0; font-size:20px; }
  .hrbrand { display:none; align-items:center; gap:14px; min-width:0; }
  .logo.big { width:84px; height:84px; font-size:24px; }
  .hrbrand b { display:block; font:600 22px/1.2 'Kanit',sans-serif; }
  .greet { display:none; text-align:right; line-height:1.3; }
  .greet .gh { display:block; font:600 22px 'Kanit',sans-serif; color:var(--accent); }
  .greet .gn { display:block; font-weight:600; }
  body.hr .top { background:color-mix(in srgb, var(--card) 35%, transparent); backdrop-filter:blur(8px); min-height:110px; max-height:200px; padding:12px 24px; }
  body.hr .hrbrand { display:flex; } body.hr .greet { display:block; }
  body.hr .me, body.hr .sbrand { display:none; }
  body.hr .bottombar { max-height:100px; min-height:44px; border-top:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; padding:6px 16px; }
  .mini { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .mini .calnav { margin-bottom:6px; } .mini .calnav b { font-size:15px; }
  .mini .cal { gap:2px; } .mini .day { min-height:30px; font-size:14px; padding:2px; border-radius:6px; } .mini .wd { font-size:12px; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .pcard { display:grid; gap:6px; justify-items:center; text-align:center; cursor:pointer; color:var(--ink); font:inherit; }
  .avatar { width:72px; height:72px; border-radius:50%; border:2px solid var(--accent); display:grid; place-items:center; flex:none;
            font:600 26px 'Kanit',sans-serif; color:var(--accent); background:var(--field); }
  .dl { display:grid; grid-template-columns:minmax(140px,1fr) 2fr; gap:8px 16px; margin:0; }
  .dl dt { color:var(--muted); } .dl dd { margin:0; font-weight:600; overflow-wrap:anywhere; }
  img.avatar { object-fit:cover; }
  .avatar.lg { width:96px; height:96px; font-size:34px; }
  .upl { border-top:1px dashed var(--line); padding-top:12px; margin-top:6px; display:grid; gap:4px; }
  .upl input[type=file], .itop input[type=file] { color:var(--muted); font-size:15px; max-width:100%; }
  .chk { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .chk input { width:20px; height:20px; }
  details { margin-top:4px; } summary { cursor:pointer; color:var(--muted); padding:6px 0; }
  .pwshow { display:inline-block; font:600 22px 'Kanit',monospace; letter-spacing:2px; background:var(--field); border:1px dashed var(--accent); border-radius:8px; padding:4px 14px; margin:6px 10px 6px 0; user-select:all; }
  .top { grid-area:top; position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:10px 18px;
         background:var(--card); border-bottom:1px solid var(--line); }
  .burger { display:none; }
  .pill { border-radius:99px; padding:1px 12px; font-size:15px; border:1px solid var(--c); color:var(--c); white-space:nowrap; }
  .pill.good { --c:var(--good); } .pill.warn { --c:var(--warn); } .pill.bad { --c:var(--bad); } .pill.mute { --c:var(--mute); }
  .online i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--good); margin-right:6px; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .clock { color:var(--muted); font-size:15px; white-space:nowrap; }
  .clock b { color:var(--accent); font-family:'Kanit',sans-serif; font-weight:500; }
  .spacer { flex:1; }
  .me { text-align:right; line-height:1.25; }
  .me b { display:block; }
  .content { grid-area:main; min-width:0; padding:16px; display:grid; gap:16px; width:100%; max-width:1240px; margin:0 auto; align-content:start; }
  footer { grid-area:bottom; text-align:center; color:var(--muted); font-size:14px; padding:6px 0 12px; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:15; }

  /* ---------- เนื้อหา ---------- */
  .row { display:grid; gap:16px; }
  .hero { grid-template-columns:1.5fr repeat(3,1fr); } .g4 { grid-template-columns:repeat(4,1fr); } .g3 { grid-template-columns:repeat(3,1fr); }
  .hm { grid-template-columns:1.5fr 1fr; } .g2 { grid-template-columns:1fr 1fr; }
  .col1 { display:grid; gap:16px; align-content:start; }
  .span2 { grid-column:span 2; } .wide { grid-column:1/-1; }
  .heroL { border-left:5px solid var(--accent); display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .heroL h1 { margin:0; font-size:26px; line-height:1.25; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips span { background:var(--field); border:1px solid var(--line); border-radius:6px; padding:1px 10px; color:var(--muted); font-size:15px; }
  .kpi { border-color:color-mix(in srgb,var(--c) 35%,var(--line)); }
  .kpi .lbl { color:var(--muted); font-size:16px; display:block; }
  .kpi .val { display:block; font-size:40px; line-height:1.15; color:var(--c); }
  .kpi small { display:block; }
  .meter { height:8px; background:var(--field); border-radius:4px; overflow:hidden; margin-top:8px; }
  .meter i { display:block; height:100%; border-radius:4px; }
  .cols { display:flex; align-items:flex-end; gap:14px; height:270px; }
  .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; text-align:center; font-size:15px; }
  .col em { font-style:normal; font-size:17px; }
  .stack { display:flex; flex-direction:column-reverse; width:100%; max-width:64px; border-radius:6px 6px 0 0; overflow:hidden; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px; font-size:15px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .ring { width:150px; height:150px; border-radius:50%; position:relative; margin:0 auto 16px; }
  .ring::after { content:""; position:absolute; inset:17px; border-radius:50%; background:var(--card); }
  .ring b { position:absolute; inset:0; z-index:1; display:grid; place-content:center; text-align:center; font-size:32px; line-height:1.1; }
  .ring b small { font:400 14px 'Sarabun',sans-serif; }
  .brow { margin-bottom:12px; }
  .btop { display:flex; justify-content:space-between; gap:8px; }
  .btop span { color:var(--muted); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:16px; }
  th { text-align:left; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.nm { font-weight:600; }
  .empty { color:var(--muted); padding:14px 0; }
  .loading { padding:40px; text-align:center; font-size:20px; color:var(--muted); }
  .loading.err { color:var(--bad); }

  /* หน้าหลักของครู */
  .big { font-size:44px; line-height:1.1; color:var(--c, var(--accent)); }
  .calnav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .calnav b { font:600 18px 'Kanit',sans-serif; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal .wd { text-align:center; color:var(--muted); font-size:14px; padding:2px 0; }
  .day { min-height:44px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); font:500 16px 'Sarabun',sans-serif;
         cursor:pointer; position:relative; padding:4px; }
  .day:hover { border-color:var(--accent); }
  .day.today { border:2px solid var(--accent); color:var(--accent); font-weight:600; }
  .day.sel { background:var(--field); }
  .day.has::after { content:""; position:absolute; bottom:5px; left:50%; width:7px; height:7px; margin-left:-3.5px; border-radius:50%; background:var(--warn); }
  .day.blank { border:0; cursor:default; }
  .annlist { margin-top:12px; display:grid; gap:8px; }
  .ann { border-left:4px solid var(--warn); background:var(--field); border-radius:0 8px 8px 0; padding:6px 12px; }
  .ann small { display:block; }
  .vrow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .vrow:last-child { border-bottom:0; }
  .vrow span { color:var(--muted); }
  .docb { display:flex; flex-direction:column; gap:8px; align-items:stretch; }
  .docb .btn { text-align:left; }

  /* หน้างาน / ตรวจงาน */
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .bar h2, .pageh { margin:0; font-size:22px; }
  .fg { display:grid; grid-template-columns:repeat(2,1fr); gap:0 14px; }
  .item { display:grid; gap:8px; }
  .lst { display:grid; gap:12px; }
  .itop { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .itop b { font-size:18px; flex:1; min-width:160px; }
  .cat { background:var(--field); border:1px solid var(--line); border-radius:6px; padding:0 10px; font-size:15px; color:var(--accent); }
  .meta { color:var(--muted); font-size:16px; }
  .lnk { color:var(--accent); font-weight:600; width:fit-content; }
  .note { border-left:4px solid var(--warn); padding:4px 12px; background:var(--field); border-radius:0 8px 8px 0; }
  .acts { display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; align-items:center; }
  .hint { color:var(--muted); font-size:15px; margin:-8px 0 12px; }

  @media (max-width:1000px) { .hero, .g3 { grid-template-columns:1fr 1fr; } .heroL { grid-column:1/-1; } .g4 { grid-template-columns:1fr 1fr; } .hm { grid-template-columns:1fr; } }
  @media (max-width:900px) {
    .app, body.hr .app { grid-template-columns:1fr; grid-template-areas:"top" "main" "bottom"; }
    body.hr .app { grid-template-areas:"top" "main" "right" "bottom"; }
    .rightp { position:static; height:auto; border-left:0; border-top:1px solid var(--line); }
    .side { position:fixed; left:0; top:0; height:100vh; z-index:20; width:min(300px,85vw); transform:translateX(-100%); transition:transform .2s; }
    .side.open { transform:none; }
    .burger { display:inline-block; }
  }
  @media (max-width:620px) { .hero, .g3, .g4, .g2 { grid-template-columns:1fr; } .span2, .wide { grid-column:auto; } .fg { grid-template-columns:1fr; } .me { text-align:left; } }
  @media (prefers-reduced-motion:reduce) { .online i { animation:none; } .side { transition:none; } }
</style>
</head>
<body>

<!-- Login กลาง -->
<div id="sLogin" class="center" hidden>
  <div class="corner"><button class="btn ghost sm jsTheme" type="button"></button><button class="btn ghost sm jsLang" type="button"></button></div>
  <form class="card login" id="fLogin" autocomplete="off">
    <div class="logo">RAV</div>
    <h1 data-i18n="app.title"></h1>
    <p class="sub" data-i18n="lg.sub"></p>
    <label class="field"><span data-i18n="lg.id"></span><input type="text" id="lgId" autocapitalize="none" spellcheck="false" required></label>
    <label class="field"><span data-i18n="lg.pin"></span><input type="password" id="lgPin" required></label>
    <label class="showpw"><input type="checkbox" id="lgShow"><span data-i18n="lg.show"></span></label>
    <p class="msg" id="lgMsg" role="alert"></p>
    <button class="btn main block" id="lgBtn" type="submit" data-i18n="lg.btn"></button>
    <p class="help" data-i18n="lg.help"></p>
  </form>
</div>

<!-- เปลี่ยนรหัส (บังคับตอนเข้าครั้งแรก) -->
<div id="sChange" class="center" hidden>
  <div class="corner"><button class="btn ghost sm jsTheme" type="button"></button><button class="btn ghost sm jsLang" type="button"></button></div>
  <form class="card login" id="fChange" autocomplete="off">
    <div class="logo">RAV</div>
    <h1 id="chTitle"></h1>
    <p class="sub" id="chSub"></p>
    <label class="field"><span data-i18n="ch.old"></span><input type="password" id="chOld" required></label>
    <label class="field"><span data-i18n="ch.new"></span><input type="password" id="chNew" required minlength="6"></label>
    <label class="field"><span data-i18n="ch.new2"></span><input type="password" id="chNew2" required minlength="6"></label>
    <p class="msg" id="chMsg" role="alert"></p>
    <button class="btn main block" id="chBtn" type="submit" data-i18n="ch.save"></button>
    <p class="help"><button class="btn ghost sm" type="button" id="chCancel" data-i18n="ch.cancel" hidden></button></p>
  </form>
</div>

<!-- ระบบหลัก: เมนูซ้าย + แถบบน + เนื้อหา -->
<div id="sApp" class="app" hidden>
  <header class="top" id="top">
    <button class="btn ghost sm burger" id="burger" type="button" aria-label="Menu">☰</button>
    <div class="hrbrand"><span class="logo big">RAV</span><div><b data-i18n="app.title"></b><small data-i18n="hr.sub"></small></div></div>
    <span class="pill good online"><i></i><span data-i18n="sh.online"></span></span>
    <span class="clock"><span data-i18n="sh.session"></span> <b id="sess">00:00:00</b></span>
    <span class="clock"><b id="clkDate"></b> <b id="clkTime"></b> GMT+7</span>
    <span class="spacer"></span>
    <div class="greet"><span class="gh" id="gHello"></span><span class="gn" id="gName"></span><small id="gSub"></small></div>
    <button class="btn ghost sm jsTheme" type="button"></button>
    <button class="btn ghost sm jsLang" type="button"></button>
    <div class="me"><b id="meName"></b><small id="meSub"></small></div>
  </header>
  <aside id="side" class="side">
    <div class="sbrand"><span class="logo">RAV</span><div><b data-i18n="app.title"></b><small>Foreign Department</small></div></div>
    <nav id="nav" aria-label="Main menu"></nav>
    <div id="miniCal" class="mini" hidden></div>
    <div class="sfoot">

  function calendarCard(anns) {
    const box = h('section', 'card'); box.append(h('h2', '', t('hm.cal')));
    const td = bkkToday(); let y = td.y, m = td.m, sel = null;
    const nav = h('div', 'calnav'), title = h('b'), grid = h('div', 'cal'), list = h('div', 'annlist');
    const prev = btn('‹', 'ghost sm', () => { m--; if (m < 0) { m = 11; y--; } sel = null; draw(); }); prev.setAttribute('aria-label', t('hm.prev'));

    nav.append(prev, title, next); box.append(nav, grid, list);
    function draw() {
      title.textContent = new Date(Date.UTC(y, m, 1)).toLocaleDateString(loc(), { month: 'long', year: 'numeric', timeZone: 'UTC' });
      grid.textContent = '';

      const first = new Date(Date.UTC(y, m, 1)).getUTCDay(), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(), prefix = y + '-' + pad2(m + 1) + '-';
      const has = {}; anns.forEach(a => { if (a.date.indexOf(prefix) === 0) has[a.date] = true; });
      for (let i = 0; i < first; i++) grid.append(h('div', 'day blank'));
      for (let d = 1; d <= days; d++) {
        const key = prefix + pad2(d), b = h('button', 'day' + (has[key] ? ' has' : '') + (y === td.y && m === td.m && d === td.d ? ' today' : '') + (sel === key ? ' sel' : ''), String(d));
        b.type = 'button'; b.onclick = () => { sel = sel === key ? null : key; draw(); }; grid.append(b);
      }
      list.textContent = '';
      const shown = anns.filter(a => sel ? a.date === sel : a.date.indexOf(prefix) === 0).sort((p, q) => p.date < q.date ? -1 : 1);

  const KINDS = { Scores: ['PAA', 'MS1', 'PAB', 'FS1', 'PAC', 'MS2', 'PAD', 'FS2'], Exams: ['Midterm', 'Final'] }; // ต้องตรงกับ KINDS ใน Code.gs

  function makeEditor(cat, afterSave) {
    const f = h('form', 'card'); f.hidden = true; f.autocomplete = 'off';
    const ttl = h('h2'), fg = h('div', 'fg');
    const subject = inp('edSubject', 100), klass = inp('edClass', 100), term = inp('edTerm', 50, true), title = inp('edTitleIn', 200, true), url = inp('edUrl', 1000);
    let kind = null;

      kind = h('select'); KINDS[cat].forEach(k => { const o = h('option', '', t('k.' + k)); o.value = k; kind.append(o); });
      fg.append(field(t(cat === 'Scores' ? 'wk.kindScore' : 'wk.kindExam'), kind));
    }
    fg.append(field(t('wk.subject'), subject), field(t('wk.class'), klass), field(t('wk.term'), term), field(t('wk.title'), title));
    const msg = h('p', 'msg'); msg.setAttribute('role', 'alert');
    const cancel = btn(t('wk.cancel'), 'ghost', () => close()), save = h('button', 'btn ghost', t('wk.saveDraft')); save.type = 'submit';
    const send = btn(t('wk.saveSend'), 'main sm', () => doSave(true));
    f.append(ttl, fg); if (cat === 'Scores') f.append(h('p', 'hint', t('wk.scoreHint')));
    f.append(field(t('wk.url'), url), msg, (() => { const a = h('div', 'acts'); a.append(cancel, save, send); return a; })());
    let editing = null;
    function busy(b) { save.disabled = b; send.disabled = b; }
    function close() { editing = null; f.hidden = true; }
    function open(it) {
      editing = it || null; ttl.textContent = it ? t('wk.editTitle') : t('wk.addTitle');
      if (kind) kind.value = it && it.kind ? it.kind : KINDS[cat][0];
      subject.value = it ? it.subject : ''; klass.value = it ? it['class'] : ''; term.value = it ? it.term : ''; title.value = it ? it.title : ''; url.value = it ? it.fileUrl : '';
      msg.textContent = ''; f.hidden = false; f.scrollIntoView({ block: 'nearest' }); title.focus();
    }
    function doSave(andSend) {
      if (!f.reportValidity()) return;
      msg.textContent = ''; busy(true);
      const item = { id: editing ? editing.id : '', subject: subject.value, class: klass.value, term: term.value, kind: kind ? kind.value : '', title: title.value, fileUrl: url.value };
      api('saveWork', [cat, item], r => {
        if (!r.ok) { busy(false); msg.textContent = errText(r); return; }
        if (!andSend) { busy(false); close(); afterSave(); return; }
        api('submitWork', [cat, r.id], r2 => {
          busy(false);
          if (r2.ok) { close(); afterSave(); return; }
          editing = { id: r.id, category: cat }; msg.textContent = t('wk.savedNoSend') + errText(r2); afterSave();

  function resizeImage(file, max, ok, fail) { // ย่อรูปให้เล็กก่อนส่ง (JPEG) เพื่ออัปโหลดเร็วและประหยัดที่เก็บ
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(); };
    img.src = url;
  }

    $('clkDate').textContent = now.toLocaleDateString(loc(), { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Bangkok' });
    $('clkTime').textContent = now.toLocaleTimeString(loc(), { hour12: false, timeZone: 'Asia/Bangkok' }); setGreeting();
    if (t0) { const s = Math.max(0, Math.floor((Date.now() - t0) / 1000)); $('sess').textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(pad2).join(':'); }
  }
  setInterval(tick, 1000); tick();

  applyStatic();
  token = loadTok();
  if (token) { try { t0 = Number(sessionStorage.getItem('rav_t0')) || null; } catch (e) {} loadApp(); } else toLogin();
</script>
